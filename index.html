<style>:root{--navy:#0F1923;--teal:#0A6E6E;--teal2:#0D9488;--bg:#F4F6F8;--bd:#E2E8F0;--tx:#1E293B;--mut:#64748B;--red:#DC2626;--grn:#059669;--amb:#D97706}

// ── tarehe ──
function addMonthsISO(iso, n){
  const d = new Date(String(iso).slice(0,10)+'T00:00:00Z'); if(isNaN(d)) return iso;
  const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day,last)); return d.toISOString().slice(0,10);
}
function daysLeft(iso){ const x = new Date(String(iso).slice(0,10)+'T00:00:00Z'); return Math.floor((x - new Date())/86400000); }
function monthsBetween(a, b){
  const s = new Date(a+'T00:00:00Z'), e = new Date(b+'T00:00:00Z'); if(isNaN(s)||isNaN(e)||e<=s) return 1;
  let m = (e.getUTCFullYear()-s.getUTCFullYear())*12 + (e.getUTCMonth()-s.getUTCMonth());
  const diff = (e - new Date(addMonthsISO(a,m)+'T00:00:00Z'))/86400000;
  if(diff > 15) m++; else if(diff < -15) m--; return Math.max(1, Math.min(120, m));
}
// ── simu na msimbo ──
function normPhone(p){ let d = String(p||'').replace(/\D/g,''); if(d.startsWith('255')) d = '0'+d.slice(3); else if(d.length===9) d = '0'+d; return /^0\d{9}$/.test(d) ? d : ''; }
const emailFor = phone => 't255' + phone.slice(1) + '@mpangaji.kiseja.com';
function genCode(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = new Uint8Array(8);
  try{ (window.crypto||window.msCrypto).getRandomValues(a); }catch(e){ for(let i=0;i<8;i++) a[i] = Math.floor(Math.random()*256); }
  return Array.from(a).map(b => A[b % A.length]).join('');
}

// ── injini ya kodi (kutoka mfumo wa zamani, iliyojaribiwa) ──
// Kodi inalipwa mapema kwa miezi; malipo yanafunika miezi kamili kulingana na kiasi; salio linabebwa; deni = miezi iliyopita × pango − salio
function acct(t){
  const dl = daysLeft(t.kuisha), expired = dl < 0, monthsOverdue = expired ? Math.ceil(-dl/30.4375) : 0;
  const rent = parseInt(t.rent)||0, net = parseInt(t.salio)||0, overdueAmt = monthsOverdue*rent;
  return {paidThrough:t.kuisha, dl, expired, monthsOverdue, rent, net, overdueAmt, deni:Math.max(0,overdueAmt-net), salio:Math.max(0,net-overdueAmt)};
}
function payCover(a, startISO, rent, miezi, kilipo){
  const jumla = rent*miezi, avail = kilipo + a.net;
  let covered = rent>0 ? Math.floor(avail/rent) : miezi; covered = Math.max(0, Math.min(miezi, covered));
  return {jumla, avail, covered, mpya:addMonthsISO(startISO, covered), salio:avail - covered*rent, hali: covered>=miezi ? 'IMELIPWA' : (kilipo>0 ? 'SEHEMU' : 'HAIJALIPIWA')};
}
function payBadge(a){ return a.deni>0 ? '<span class="bdg r">Deni TZS '+tzs(a.deni)+'</span>' : (a.salio>0 ? '<span class="bdg g">Salio +'+tzs(a.salio)+'</span>' : '<span class="bdg g">Imelipwa</span>'); }
const METHODS = ['M-PESA','TIGO PESA','AIRTEL MONEY','HALOPESA','BENKI','TASLIMU'];
function statusBadge(p){ return p.status==='pending' ? '<span class="bdg a">Inasubiri idhini</span>' : p.status==='rejected' ? '<span class="bdg r">Imekataliwa</span>' : '<span class="bdg g">'+(p.hali==='SEHEMU'?'Sehemu':'Imekubaliwa')+'</span>'; }

// ── QR (qrcode-generator, MIT) ──
function qrSvg(text){
  const q = qrcode(0,'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2, size = n+2*m; let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c+m},${r+m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
const verifyUrl = no => APP_URL() + '?hakiki=' + encodeURIComponent(no);
function friendlyErr(e){
  const c = (e && e.code) || '';
  if(c==='auth/email-already-in-use') return 'Akaunti hii tayari ipo. Bofya "Ingia".';
  if(c==='auth/wrong-password' || c==='auth/invalid-credential' || c==='auth/user-not-found' || c==='auth/invalid-login-credentials') return 'Taarifa si sahihi. Angalia na ujaribu tena.';
  if(c==='auth/weak-password') return 'Nenosiri liwe na herufi 6 au zaidi.';
  if(c==='auth/invalid-email') return 'Barua pepe si sahihi.';
  if(c==='auth/network-request-failed') return 'Hakuna mtandao. Jaribu tena.';
  if(c==='auth/too-many-requests') return 'Majaribio mengi. Subiri kidogo, kisha ujaribu tena.';
  if(c==='permission-denied') return 'Huna ruhusa ya kufanya hili.';
  if(typeof e === 'string') return e;
  return (e && e.message) ? e.message : 'Kuna tatizo. Jaribu tena.';
}

async function doOwnerLogin(){
  authErr(''); const email = val('a-email'), pw = $('a-pw').value;
  if(!email || !pw) return authErr('Jaza barua pepe na nenosiri');
  busy(true); try{ await auth.signInWithEmailAndPassword(email, pw); }catch(e){ authErr(friendlyErr(e)); } busy(false);
}
async function doOwnerRegister(){
  authErr(''); const name = val('a-name'), email = val('a-email'), pw = $('a-pw').value;
  if(!name || !email || !pw) return authErr('Jaza taarifa zote');
  S.busy = true; busy(true); let cred = null;
  try{
    cred = await auth.createUserWithEmailAndPassword(email, pw); const uid = cred.user.uid, b = db.batch();
    b.set(db.collection('workspaces').doc(uid), {name, ownerUid:uid, tenantSeq:0, createdAt:TS()});
    b.set(db.collection('members').doc(uid), {role:'owner', ws:uid, name});
    await b.commit(); S.busy = false; await boot(cred.user);
  }catch(e){
    S.busy = false; if(cred && cred.user){ try{ await cred.user.delete(); }catch(x){} }
    authErr(friendlyErr(e));
  }
  busy(false);
}
async function doTenantLogin(){
  authErr(''); const phone = normPhone(val('a-phone')), pw = $('a-pw').value;
  if(!phone) return authErr('Namba ya simu si sahihi (mfano 0712345678)'); if(!pw) return authErr('Weka nenosiri');
  busy(true); try{ await auth.signInWithEmailAndPassword(emailFor(phone), pw); }catch(e){ authErr(friendlyErr(e)); } busy(false);
}
async function doTenantJoin(){
  authErr(''); const code = val('a-code').toUpperCase().replace(/[^A-Z0-9]/g,''), phone = normPhone(val('a-phone')), pw = $('a-pw').value;
  if(code.length !== 8) return authErr('Msimbo una herufi 8'); if(!phone) return authErr('Namba ya simu si sahihi (mfano 0712345678)'); if(pw.length < 6) return authErr('Nenosiri liwe na herufi 6 au zaidi');
  S.busy = true; busy(true); let cred = null;
  try{
    cred = await auth.createUserWithEmailAndPassword(emailFor(phone), pw); const uid = cred.user.uid;
    const iv = await db.collection('invites').doc(code).get();
    if(!iv.exists) throw 'Msimbo si sahihi. Angalia na ujaribu tena.';
    const inv = iv.data();
    if(inv.used) throw 'Msimbo huu umeshatumika. Omba msimbo mpya kwa mwenye nyumba.';
    if(normPhone(inv.phone) !== phone) throw 'Namba ya simu haifanani na ile aliyoandika mwenye nyumba.';
    const b = db.batch();
    b.set(db.collection('members').doc(uid), {role:'tenant', ws:inv.ws, tenantId:inv.tenantId, code, name:inv.name||''});
    b.update(db.collection('invites').doc(code), {used:true, usedBy:uid, usedAt:TS()});
    await b.commit(); S.busy = false; await boot(cred.user);
  }catch(e){
    S.busy = false; if(cred && cred.user){ try{ await cred.user.delete(); }catch(x){} }
    if(e && e.code==='auth/email-already-in-use'){ A.role = 'tenant'; A.mode = 'login'; renderAuth(); }   // akaunti ipo: mpeleke kuingia
    authErr(friendlyErr(e));   // vinginevyo acha alichoandika kibaki
  }
  busy(false);
}
async function doLogout(){ try{ await auth.signOut(); }catch(e){} S.member = null; S.tab = ''; }

// ════════ KUANZA ════════
async function boot(user){
  if(S.busy) return;
  S.user = user;
  if(!CONFIGURED){ renderAuth(); show('screen-auth'); return; }
  const hk = qparam('hakiki');
  if(hk && !S.hkShown){ S.hkShown = true; renderVerify(hk); show('screen-verify'); return; }
  if(!user){ S.member = null; if($('screen-auth').classList.contains('hidden')){ renderAuth(); show('screen-auth'); } return; }   // usifute ujumbe wa kosa ulioonyeshwa tayari
  busy(true);
  try{
    const m = await db.collection('members').doc(user.uid).get();
    if(!m.exists){ await auth.signOut(); renderAuth('Akaunti hii haijakamilika. Jisajili au jiunge tena.'); show('screen-auth'); busy(false); return; }
    S.member = m.data(); S.ws = S.member.ws;
    if(S.member.role === 'owner'){ await loadOwner(); if(!S.tab || !['dash','wap','mal','nyu'].includes(S.tab)) S.tab = 'dash'; }
    else { await loadTenant(); if(!['home','lipa','ris','mimi'].includes(S.tab)) S.tab = 'home'; }
    renderApp(); show('screen-app');
  }catch(e){ console.error(e); toast(friendlyErr(e), true); renderAuth(friendlyErr(e)); show('screen-auth'); }
  busy(false);
}
function renderApp(){ if(!S.member) return; S.member.role === 'owner' ? renderOwner() : renderTenant(); }
function goTab(t){ S.tab = t; renderApp(); window.scrollTo(0,0); }
async function refresh(){ busy(true); try{ S.member.role==='owner' ? await loadOwner() : await loadTenant(); renderApp(); }catch(e){ toast(friendlyErr(e), true); } busy(false); }

async function loadOwner(){
  const ws = S.ws, q = c => db.collection(c).where('ws','==',ws).get();
  const [t,u,p,i] = await Promise.all([q('tenants'), q('units'), q('payments'), q('invites')]);
  const map = x => x.docs.map(d => ({id:d.id, ...d.data()}));
  S.tenants = map(t).sort((a,b)=>String(a.no).localeCompare(String(b.no)));
  S.units = map(u).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  S.payments = map(p).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
  S.invites = map(i);
}

async function saveTenantForm(id){
  const name = val('f-name'), phone = normPhone(val('f-phone')), unit = val('f-unit'), rent = parseInt(val('f-rent'))||0, start = val('f-start');
  if(!name || !unit || rent <= 0 || !start) return toast('Jaza jina, nyumba, pango na tarehe ya kuingia', true);
  if(!phone) return toast('Namba ya simu si sahihi (mfano 0712345678)', true);
  if(S.tenants.find(t=>t.phone===phone && t.id!==id && t.status!=='x')) return toast('Namba hii ya simu tayari ipo kwa mpangaji mwingine', true);
  busy(true);
  try{
    if(!S.units.find(u=>u.name===unit)) await db.collection('units').add({ws:S.ws, name:unit, rent, note:'', createdAt:TS()});
    if(id){
      await db.collection('tenants').doc(id).update({name, phone, unit, rent, startDate:start});
      const inv = S.invites.find(i=>i.tenantId===id && !i.used); if(inv && inv.phone !== phone) await db.collection('invites').doc(inv.id).update({phone, name});
      await loadOwner(); closeModal(); renderApp(); toast('Imehifadhiwa');
    }else{
      const paid = val('f-paid') || start, code = genCode(), tref = db.collection('tenants').doc();
      await db.runTransaction(async tx => {
        const wref = db.collection('workspaces').doc(S.ws), w = await tx.get(wref), seq = ((w.data()||{}).tenantSeq||0) + 1;
        tx.update(wref, {tenantSeq:seq});
        tx.set(tref, {ws:S.ws, no:pad3(seq), name, phone, unit, rent, startDate:start, kuisha:paid, salio:0, seq:0, status:'a', createdAt:TS()});
        tx.set(db.collection('invites').doc(code), {ws:S.ws, tenantId:tref.id, phone, name, used:false, createdAt:TS()});
      });
      await loadOwner(); renderApp(); openTenant(tref.id); toast('Mpangaji ameongezwa. Mpe msimbo wake.');
    }
  }catch(e){ toast(friendlyErr(e), true); } busy(false);
}
async function markLeft(id){

  const msg = 'Mwondoe ' + t.name + ' kwenye orodha ya wapangaji?' + (a.deni>0 ? '\n\n⚠️ Ana deni la TZS ' + tzs(a.deni) + '.' : '') + (!a.expired ? '\n\nAmelipa kodi hadi ' + fmt(t.kuisha) + '.' : '');

}

function openApprove(pid){

  if(p.status !== 'pending') return openModal(`<h2>Malipo<button class="x" onclick="closeModal()">✕</button></h2>${payInfo(p)}<div class="banner r" style="margin-top:12px">Yamekataliwa: ${esc(p.reason||'—')}</div>`);

  openModal(`<h2>Idhinisha Malipo<button class="x" onclick="closeModal()">✕</button></h2>${payInfo(p)}

    <div class="acts"><button class="btn red" onclick="openReject('${pid}')">Kataa</button><button class="btn grn" onclick="approveNow('${pid}')">✔ Kubali</button></div>`);

async function approvePayment(pid){
  const pref = db.collection('payments').doc(pid); let out = null;
  await db.runTransaction(async tx => {
    const ps = await tx.get(pref); if(!ps.exists) throw 'Malipo hayapatikani'; const p = ps.data(); if(p.status !== 'pending') throw 'Malipo haya yameshashughulikiwa';
    const tref = db.collection('tenants').doc(p.tenantId), ts = await tx.get(tref), t = ts.data();
    const a = acct(t), start = a.paidThrough || t.startDate, r = payCover(a, start, parseInt(t.rent)||0, p.months, p.amount);
    const seq = (t.seq||0) + 1, no = 'RCP-' + S.ws.slice(0,5).toUpperCase() + '-' + t.no + '-' + String(seq).padStart(3,'0');
    tx.update(pref, {status:'approved', receiptNo:no, kuanza:start, mpya:r.mpya, covered:r.covered, salio:r.salio, hali:r.hali, decidedAt:TS(), decidedBy:S.user.uid});
    tx.update(tref, {kuisha:r.mpya, salio:r.salio, seq});
    tx.set(db.collection('receipts').doc(no), {ws:S.ws, no, name:t.name, unit:t.unit, amount:p.amount, paidOn:p.paidOn, kuanza:start, mpya:r.mpya, hali:r.hali, method:p.method});
    out = {no, r};
  });
  return out;
}
async function approveNow(pid){
  busy(true);
  try{ const o = await approvePayment(pid); await loadOwner(); closeModal(); renderApp(); toast('✔ Imekubaliwa. Risiti ' + o.no); }

}
function openReject(pid){

async function rejectNow(pid){

function payTenant(p){ return p==='o' ? S.tenants.find(x=>x.id===val('o-tenant')) : S.tenant; }
function payPrev(p){
  const t = payTenant(p), box = $(p+'-prev'); if(!t){ box.innerHTML = ''; return; }
  const a = acct(t), m = Math.max(1, parseInt(val(p+'-miezi'))||3), rent = parseInt(t.rent)||0;
  const hd = $(p+'-hadi'); if(hd && document.activeElement !== hd) hd.value = addMonthsISO(a.paidThrough, m);
  const am = $(p+'-amt'); if(am && am.dataset.t !== '1' && document.activeElement !== am) am.value = rent*m;   // pendekeza kiasi = pango × miezi
  const amt = parseInt(val(p+'-amt'))||0, r = payCover(a, a.paidThrough, rent, m, amt);
  box.innerHTML = `Kodi ya miezi ${m} = <b>TZS ${tzs(rent*m)}</b> (kipindi ${fmt(a.paidThrough)} → ${fmt(addMonthsISO(a.paidThrough,m))}). ` + (amt>0 ? `Kiasi hiki kinafunika miezi <b>${r.covered}</b> (hadi <b>${fmt(r.mpya)}</b>)${r.salio>0?`, salio TZS ${tzs(r.salio)}`:''}.` : 'Weka kiasi kilicholipwa.');
}
function payHadi(p){ const t = payTenant(p); if(!t) return; const hd = val(p+'-hadi'); if(!hd) return; $(p+'-miezi').value = monthsBetween(acct(t).paidThrough, hd); const am = $(p+'-amt'); if(am) am.dataset.t = ''; payPrev(p); }

async function loadTenant(){
  const tid = S.member.tenantId, ws = S.ws;
  const [t, pv, p] = await Promise.all([
    db.collection('tenants').doc(tid).get(), db.collection('tenantPrivate').doc(tid).get(),
    db.collection('payments').where('tenantId','==',tid).where('ws','==',ws).get() ]);
  if(!t.exists) throw 'Taarifa zako hazipatikani. Wasiliana na mwenye nyumba.';
  S.tenant = {id:t.id, ...t.data()}; S.priv = pv.exists ? pv.data() : {};
  S.payments = p.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));
}

}
async function submitPayment(){
  const t = S.tenant, amount = parseInt(val('t-amt'))||0, months = Math.max(1, Math.min(24, parseInt(val('t-miezi'))||3)), method = val('t-method'), ref = val('t-ref').toUpperCase(), paidOn = val('t-date') || todayISO();
  if(amount <= 0) return toast('Weka kiasi ulicholipa', true);
  if(method !== 'TASLIMU' && ref.length < 4) return toast('Weka namba ya muamala (kwenye ujumbe wa M-PESA/benki)', true);
  if(ref && S.payments.some(p=>p.ref===ref && p.status!=='rejected')) return toast('Namba hii ya muamala imeshatumwa', true);
  if(S._paying) return; S._paying = true; busy(true);
  try{
    await db.collection('payments').add({ws:S.ws, tenantId:t.id, tenantName:t.name, unit:t.unit, amount, months, method, ref, paidOn, note:'', status:'pending', createdBy:'tenant', createdAt:TS()});
    await loadTenant(); S.tab = 'ris'; renderApp(); toast('✔ Malipo yametumwa. Yanasubiri idhini ya mwenye nyumba.');
  }catch(e){ toast(friendlyErr(e), true); } S._paying = false; busy(false);
}
function tRis(){

    ? `<div class="row tap" onclick="openReceipt('${p.id}')"><div><div class="b">${esc(p.receiptNo)}</div><div class="sm mut">${fmt(p.paidOn)} · ${fmt(p.kuanza)} → ${fmt(p.mpya)}</div></div><div class="r"><div class="b">TZS ${tzs(p.amount)}</div>${statusBadge(p)}</div></div>`
    : `<div class="row"><div><div class="b">TZS ${tzs(p.amount)} · ${esc(p.method)}</div><div class="sm mut">${fmt(p.paidOn)}${p.reason?' · '+esc(p.reason):''}</div></div><div class="r">${statusBadge(p)}</div></div>`;
  return `<h2>Risiti na Malipo Yangu</h2>${S.payments.length ? '<div class="list">'+S.payments.map(row).join('')+'</div>' : '<div class="empty">Bado hujafanya malipo.</div>'}
    <button class="link" onclick="openVerifyPublic()">🔎 Hakiki Risiti</button>`;
}
function tMimi(){
  const p = S.priv, t = S.tenant;

    <div class="card"><label style="margin-top:0">Aina ya kitambulisho</label><select id="m-nt" class="inp">${['','NIDA','Leseni ya Udereva','Kitambulisho cha Kupigia Kura','Pasipoti','Kitambulisho cha Kazi','Nyingine'].map(o=>`<option ${o===(p.nidaType||'')?'selected':''}>${o}</option>`).join('')}</select>
    <label>Namba ya kitambulisho (NIDA n.k.)</label><input id="m-nida" class="inp" value="${esc(p.nida||'')}">
    <h3>👥 Mtu wa karibu (kwa dharura)</h3><label>Jina lake</label><input id="m-kn" class="inp" value="${esc(p.kinName||'')}">
    <label>Namba yake ya simu</label><input id="m-kp" class="inp" type="tel" value="${esc(p.kinPhone||'')}">
    <label>Uhusiano</label><select id="m-kr" class="inp">${['','Mke/Mume','Mzazi','Ndugu','Mtoto','Rafiki','Mwajiri','Nyingine'].map(o=>`<option ${o===(p.kinRel||'')?'selected':''}>${o}</option>`).join('')}</select>
    <button class="btn full" onclick="saveProfile()">Hifadhi Taarifa</button></div>`;
}
async function saveProfile(){
  const nidaType = val('m-nt'), nida = val('m-nida'), kinName = val('m-kn'), kinPhone = val('m-kp'), kinRel = val('m-kr'), warn = [];
  if(nida && nidaType === 'NIDA' && nida.replace(/\D/g,'').length !== 20) warn.push('NIDA kwa kawaida ina tarakimu 20');
  if(kinPhone && !normPhone(kinPhone)) warn.push('Namba ya mtu wa karibu haionekani sahihi');
  busy(true);
  try{
    await db.collection('tenantPrivate').doc(S.tenant.id).set({ws:S.ws, nidaType, nida, kinName, kinPhone, kinRel, updatedAt:TS()});
    await loadTenant(); renderApp(); toast(warn.length ? '⚠️ ' + warn.join(' · ') + ' — imehifadhiwa' : '✔ Taarifa zimehifadhiwa', !!warn.length);
  }catch(e){ toast(friendlyErr(e), true); } busy(false);
}

// ════════ HAKIKI RISITI (wazi kwa yeyote mwenye namba au barcode) ════════
let _vStream = null, _vRAF = 0, _vJsqrP = null;
function vParse(raw){
  raw = (raw||'').trim();
  if(/^https?:\/\//i.test(raw)){ try{ raw = (new URL(raw).searchParams.get('hakiki')||'').trim(); }catch(e){ return ''; } }
  raw = raw.toUpperCase(); return /^RCP-[A-Z0-9]{3,8}-\d{1,6}-\d{1,6}$/.test(raw) ? raw : '';
}
function vCard(ok, html){
  return `<div class="vcard ${ok?'':'bad'}"><div class="b" style="color:${ok?'var(--grn)':'var(--red)'};margin-bottom:6px">${ok?'✅ RISITI HALALI':'❌ HAIJATHIBITIKA'}</div>${html}</div>`;
}
function renderVerify(prefill){
  $('screen-verify').innerHTML = `<div class="acard"><div class="alogo">🔎</div><h1>Hakiki Risiti</h1><p class="mut">Thibitisha risiti ya KISEJA NYUMBA</p>
    <label>Namba ya risiti</label><input id="v-no" class="inp mono" placeholder="RCP-XXXXX-001-001" autocomplete="off" style="text-transform:uppercase" value="${esc(prefill||'')}" onkeydown="if(event.key==='Enter')verifyGo()">
    <button class="btn full" onclick="verifyGo()">🔎 Hakiki</button><button class="btn sec full" onclick="vScan()">📷 Scan Barcode kwa Kamera</button>
    <div id="v-cam" class="hidden" style="margin-top:12px"><video id="v-video" playsinline muted style="width:100%;border-radius:12px;background:#000"></video><canvas id="v-canvas" class="hidden"></canvas><div id="v-msg" class="sm mut"></div><button class="btn sec full" onclick="vStop()">✖ Funga Kamera</button></div>
    <div id="v-res"></div><button class="link" onclick="closeVerify()">← Rudi</button></div>`;
  if(prefill) verifyGo();
}
function openVerifyPublic(){ renderVerify(''); show('screen-verify'); }
function closeVerify(){ vStop(); try{ history.replaceState(null,'',location.pathname); }catch(e){} S.hkShown = true; boot(S.user); }
async function verifyGo(){
  const no = vParse(val('v-no')), out = $('v-res');
  if(!no){ out.innerHTML = vCard(false, 'Andika namba ya risiti (mfano <b>RCP-K3X9A-001-001</b>), au scan barcode.'); return; }
  out.innerHTML = '<div class="empty">⏳ Inahakiki...</div>';
  try{
    const d = await db.collection('receipts').doc(no).get();
    if(!d.exists){ out.innerHTML = vCard(false, 'Risiti <b>' + esc(no) + '</b> haipatikani. Inaweza kuwa si ya kweli, au imeandikwa vibaya.'); return; }
    const r = d.data(), row = (l,v) => `<div class="row"><span class="mut">${l}</span><b>${v}</b></div>`;
    out.innerHTML = vCard(true, `<div class="sm mut b">JINA LA MLIPAJI</div><div class="vname">${esc(r.name)}</div>`
      + row('Kiasi Kilicholipwa', 'TZS ' + tzs(r.amount)) + row('Tarehe ya Malipo', fmt(r.paidOn)) + row('Kipindi', fmt(r.kuanza) + ' → ' + fmt(r.mpya))
      + row('Nyumba', esc(r.unit)) + row('Namba ya Risiti', esc(r.no)) + (r.hali && r.hali !== 'IMELIPWA' ? row('Hali', esc(r.hali)) : ''));
  }catch(e){ console.error(e); out.innerHTML = vCard(false, 'Imeshindwa kuhakiki sasa hivi (angalia mtandao). Jaribu tena.'); }
}
function vLoadJsQR(){
  if(typeof jsQR !== 'undefined') return Promise.resolve(); if(_vJsqrP) return _vJsqrP;
  const urls = ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'];
  _vJsqrP = urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{ const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); })), Promise.reject());
  _vJsqrP.catch(()=>{ _vJsqrP = null; }); return _vJsqrP;
}
async function vScan(){
  const box = $('v-cam'), v = $('v-video'), msg = $('v-msg');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Kamera haipatikani hapa — andika namba ya risiti.', true);
  try{ _vStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }catch(e){ return toast('Ruhusa ya kamera imekataliwa au kamera haipatikani.', true); }
  v.srcObject = _vStream; try{ await v.play(); }catch(e){} box.classList.remove('hidden'); msg.textContent = 'Elekeza kamera kwenye barcode ya risiti...';
  let det = null; if('BarcodeDetector' in window){ try{ det = new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!det){ try{ await vLoadJsQR(); }catch(e){ msg.textContent = 'Imeshindwa kupakia kisomaji (angalia mtandao). Andika namba ya risiti.'; return; } }
  const cv = $('v-canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  const tick = async () => {
    if(!_vStream) return;
    if(v.readyState >= 2 && v.videoWidth){
      let val2 = null;
      try{ if(det){ const r = await det.detect(v); if(r && r[0]) val2 = r[0].rawValue; } else { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v,0,0); const im = cx.getImageData(0,0,cv.width,cv.height), c = jsQR(im.data, im.width, im.height); if(c) val2 = c.data; } }catch(e){}
      if(val2){ const no = vParse(val2); if(no){ vStop(); $('v-no').value = no; verifyGo(); return; } msg.textContent = 'Barcode hii si ya risiti ya KISEJA. Jaribu nyingine...'; }
    }
    _vRAF = requestAnimationFrame(tick);
  };
  tick();
}
function vStop(){ if(_vStream){ _vStream.getTracks().forEach(t=>t.stop()); _vStream = null; } cancelAnimationFrame(_vRAF); const b = $('v-cam'); if(b) b.classList.add('hidden'); }

// ════════ ANZA ════════
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
